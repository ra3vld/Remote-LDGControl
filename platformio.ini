; PlatformIO Project Configuration File
;
;   Build options: build flags, library dependencies, upload settings
;   Advanced options: extra scripting
;
; See: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-3248s035c
description = Remote LDG Tuner Controller (AT-1000ProII and compatible)
src_dir = src
include_dir = include
data_dir = data

[common]
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
    https://github.com/jackjansen/esp32_idf5_https_server.git
    lvgl/lvgl@^8.3.0
    bodmer/TFT_eSPI@^2.5.0

lib_ignore =
    WebServer

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; Web TLS defaults off. Add -DTLS_ENABLED=1 to a target to enable HTTPS.
    ; esp32_idf5_https_server defaults to 512-byte request chunks, which is
    ; smaller than a modern Chrome WebSocket upgrade request (~530 bytes with
    ; User-Agent + Sec-WebSocket-Extensions). The library's header parser
    ; gets stuck on the boundary, never reaches STATE_HEADERS_FINISHED, and
    ; the WS upgrade hangs. Bump to 2 KB so any reasonable request fits.
    -DHTTPS_CONNECTION_DATA_CHUNK_SIZE=2048
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_BUILD_EXAMPLES=0
    -DLV_USE_DEMO_WIDGETS=0
    -DLV_USE_DEMO_BENCHMARK=0
    -DLV_USE_DEMO_STRESS=0
    -DLV_USE_DEMO_MUSIC=0
    -I include
    ; Use an explicit path: TFT_eSPI's include directory precedes ours and
    ; also contains User_Setup.h (its default ILI9341 configuration).
    ; TFT_eSPI and the application must see the project's board setup.
    -include include/User_Setup.h

[esp32]
; Pin the Arduino 2.x framework used by the classic ESP32 board profiles.
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
board_build.partitions = partitions_custom.csv
board_build.filesystem = littlefs
upload_speed = 921600
; Apply local patches under patches/ to managed library deps before each build.
; Keep the shared HTTP server's WebSocket and optional TLS fixes under patches/.
extra_scripts = pre:scripts/apply_patches.py

[env:esp32-display]
extends = esp32
build_flags =
    ${common.build_flags}
    -DWITH_DISPLAY
    -DWITH_TOUCH

[env:esp32-remote]
extends = esp32
build_flags =
    ${common.build_flags}

[env:esp32-3248s035c]
extends = esp32
build_flags =
    ${common.build_flags}
    -DBOARD_ESP32_3248S035C
    -DWITH_DISPLAY
    -DWITH_TOUCH
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB

[env:native]
platform = native
build_flags = -std=c++11 -I test/support/mqtt -I include -DUNITY_INCLUDE_DOUBLE
test_framework = unity
lib_deps = bblanchon/ArduinoJson@^7.0.0
test_filter =
    test_native
    test_mqtt
    test_mqtt_handler
    test_meter_scale
    test_meter_geometry
