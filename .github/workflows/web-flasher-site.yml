name: 'CD: Web flasher'
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'flash.html'
      - 'web-flasher/index.html'
      - 'web-flasher/app.js'
      - 'web-flasher/provisioning.js'
      - 'web-flasher/serial-api.js'
      - 'web-flasher/style.css'
      - 'web-flasher/photos.json'
      - 'web-flasher/images/**'
      - 'scripts/update_web_flasher_site.py'
      - 'tests/test_web_flasher_browser.cjs'
      - '.github/workflows/web-flasher-site.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['CI: Firmware']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: web-flasher-website-${{ github.event_name }}-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 -m unittest discover -s tests -p test_web_flasher.py
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
        run: |
          TAG=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // ""')
          if [ -z "$TAG" ]; then
            echo "No stable firmware release yet; publish the first firmware tag before updating Pages."
            exit 0
          fi
          if [ -n "$EXPECTED_TAG" ]; then test "$TAG" = "$EXPECTED_TAG"; fi
          gh release view "$TAG" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Stable release required") else . end'
          mkdir -p artifacts/release
          gh release download "$TAG" --pattern web-flasher-site.zip --pattern SHA256SUMS --dir artifacts/release
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          EXPECTED_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: |
          python3 scripts/update_web_flasher_site.py --archive artifacts/release/web-flasher-site.zip --checksums artifacts/release/SHA256SUMS --tag "$RELEASE_TAG"
          python3 -c "import os,json;expected=os.environ['EXPECTED_COMMIT'];catalog=json.load(open('dist/web-flasher/catalog.json'));assert not expected or catalog['firmware_commit']==expected"

      - if: steps.release.outputs.tag != ''
        run: |
          npx playwright install --with-deps chromium
          CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")" node tests/test_web_flasher_browser.cjs
      - if: steps.release.outputs.tag != ''
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web-flasher
          retention-days: 1
  deploy:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prevent publishing an older website or firmware catalog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          test "$(gh release view --json tagName --jq .tagName)" = "$RELEASE_TAG"
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
