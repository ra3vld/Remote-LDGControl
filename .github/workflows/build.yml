name: Build Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install web build tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build production web assets
        run: node scripts/build_web.cjs --out .pio/web-test-assets

      - name: Install PlatformIO
        run: python -m pip install -r requirements-platformio.txt -r requirements-test.txt

      - name: Test dependency patch hook
        run: |
          python - <<'PYTHON'
          import sys, unittest
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests', pattern='test_*.py'))
          for test, detail in result.errors + result.failures:
              detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title={test.id()}::{detail}')
          sys.exit(not result.wasSuccessful())
          PYTHON

      - name: Test browser meter scale synchronization
        run: |
          node tests/test_web_assets.cjs
          node tests/test_meter_scale_web.cjs
          node tests/test_antenna_settings_web.cjs
          node tests/test_control_web.cjs
          node tests/test_settings_web.cjs
          node tests/test_language_web.cjs
          node tests/test_history_web.cjs
          node tests/test_orientation_web.cjs
          node tests/test_tuning_settings_web.cjs
          node tests/test_radio_web.cjs
          node tests/test_display_settings_web.cjs
          node tests/test_live_status_web.cjs
          node tests/test_startup_web.cjs
          node tests/test_progressive_web.cjs

      - name: Native firmware tests
        run: pio test -e native -e native-display

      - name: Build firmware and LittleFS
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* || "${{ github.event_name }}" == workflow_dispatch ]]; then
            ENVS="-e esp32-3248s035c -e esp32-display -e esp32-remote"
          else
            ENVS="-e esp32-3248s035c"
          fi
          pio run $ENVS
          pio run $ENVS -t buildfs

      - name: Package verified USB manifests
        run: node scripts/build_web_flasher.mjs --output dist/web-flasher --allow-missing

      - name: Browser flasher and USB preconfiguration tests
        run: |
          npx playwright install --with-deps chromium
          CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")" node tests/test_web_flasher_browser.cjs

      - name: Check release version and package artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c "import os,re,sys;sys.path.insert(0,'scripts');from firmware_identity import version;tag=os.environ['RELEASE_TAG'];assert re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)',tag);assert version()==tag[1:]"
          python3 scripts/web_flasher.py release --output dist/web-flasher

      - uses: actions/upload-artifact@v4
        with:
          name: web-flasher
          path: dist/web-flasher
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release
          path: dist/release

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  deploy-pages:
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-flasher
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
