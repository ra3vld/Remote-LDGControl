<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
<title id="title">Распиновка mini-DIN LDG: гнездо и лицевая сторона вилки</title><desc id="desc">Гнездо тюнера спереди: сверху 4, 3; снизу 2, 1. Вилка со стороны контактов зеркальна. Контакт 1 +12 В не используется.</desc>
<defs>
  <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1763bb"/></marker>
  <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3bb4"/></marker>
</defs>
<rect width="1440" height="560" fill="#fff"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#172b42">
<text x="40" y="48" font-size="30" fill="#172b42" text-anchor="start" font-weight="700">02 / Mini-DIN 4: сначала определите сторону разъёма</text>
<text x="40" y="82" font-size="20" fill="#52657b" text-anchor="start" font-weight="400">По LDG Meter Protocol, стр. 3 · ключ внизу · TX/RX названы со стороны тюнера</text>
<text x="275" y="140" font-size="21" fill="#172b42" text-anchor="middle" font-weight="700">Гнездо тюнера: смотрим снаружи</text>
<circle cx="275" cy="277" r="115" fill="#f5f8fc" stroke="#52657b" stroke-width="3"/>
<rect x="256" y="350" width="38" height="22" rx="1" fill="#dbe4ef" stroke="#52657b" stroke-width="2"/>
<text x="275" y="423" font-size="18" fill="#52657b" text-anchor="middle" font-weight="400">ключ / направляющая</text>
<circle cx="223" cy="241" r="18" fill="#fff" stroke="#1763bb" stroke-width="3"/>
<text x="223" y="248" font-size="22" fill="#1763bb" text-anchor="middle" font-weight="700">4</text>
<circle cx="327" cy="241" r="18" fill="#fff" stroke="#7c3bb4" stroke-width="3"/>
<text x="327" y="248" font-size="22" fill="#7c3bb4" text-anchor="middle" font-weight="700">3</text>
<circle cx="208" cy="317" r="18" fill="#fff" stroke="#364152" stroke-width="3"/>
<text x="208" y="324" font-size="22" fill="#364152" text-anchor="middle" font-weight="700">2</text>
<circle cx="342" cy="317" r="18" fill="#fff" stroke="#b52b32" stroke-width="3"/>
<text x="342" y="324" font-size="22" fill="#b52b32" text-anchor="middle" font-weight="700">1</text>
<text x="805" y="140" font-size="21" fill="#172b42" text-anchor="middle" font-weight="700">Вилка кабеля: смотрим на контакты</text>
<circle cx="805" cy="277" r="115" fill="#f5f8fc" stroke="#52657b" stroke-width="3"/>
<rect x="786" y="350" width="38" height="22" rx="1" fill="#dbe4ef" stroke="#52657b" stroke-width="2"/>
<text x="805" y="423" font-size="18" fill="#52657b" text-anchor="middle" font-weight="400">ключ / направляющая</text>
<circle cx="753" cy="241" r="18" fill="#fff" stroke="#7c3bb4" stroke-width="3"/>
<text x="753" y="248" font-size="22" fill="#7c3bb4" text-anchor="middle" font-weight="700">3</text>
<circle cx="857" cy="241" r="18" fill="#fff" stroke="#1763bb" stroke-width="3"/>
<text x="857" y="248" font-size="22" fill="#1763bb" text-anchor="middle" font-weight="700">4</text>
<circle cx="738" cy="317" r="18" fill="#fff" stroke="#b52b32" stroke-width="3"/>
<text x="738" y="324" font-size="22" fill="#b52b32" text-anchor="middle" font-weight="700">1</text>
<circle cx="872" cy="317" r="18" fill="#fff" stroke="#364152" stroke-width="3"/>
<text x="872" y="324" font-size="22" fill="#364152" text-anchor="middle" font-weight="700">2</text>
<text x="1032" y="194" font-size="21" fill="#b52b32" text-anchor="start" font-weight="700">1  +12 В · изолировать</text>
<text x="1032" y="245" font-size="21" fill="#364152" text-anchor="start" font-weight="700">2  GND</text>
<text x="1032" y="296" font-size="21" fill="#7c3bb4" text-anchor="start" font-weight="700">3  RX в тюнер</text>
<text x="1032" y="347" font-size="21" fill="#1763bb" text-anchor="start" font-weight="700">4  TX из тюнера</text>
<rect x="40" y="458" width="1360" height="70" rx="10" fill="#fff9ec" stroke="#dec78e" stroke-width="2"/>
<text x="64" y="487" font-size="21" fill="#172b42" text-anchor="start" font-weight="700">Это виды со стороны соединения, а не со стороны пайки.</text>
<text x="64" y="514" font-size="19" fill="#52657b" text-anchor="start" font-weight="400">Паяльные чашки определяйте по документации своей вилки и прозвонкой. Кабель S-Video не использовать.</text>
</g></svg>
