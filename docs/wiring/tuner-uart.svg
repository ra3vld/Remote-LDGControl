<rect x="740" y="822" width="660" height="228" rx="10" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="764" y="853" font-size="21" fill="#172b42" text-anchor="start" font-weight="700">U2: питание и разрешение выхода</text>
<text x="764" y="885" font-size="19" fill="#b52b32" text-anchor="start" font-weight="700">5 В от БП</text>
<polyline points="764,900 1290,900" fill="none" stroke="#b52b32" stroke-width="3" stroke-linejoin="round"/>
