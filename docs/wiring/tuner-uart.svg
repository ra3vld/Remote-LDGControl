<text x="892" y="583" font-size="20" fill="#7c3bb4" text-anchor="end" font-weight="400">A · 2</text>
<text x="720" y="621" font-size="19" fill="#52657b" text-anchor="middle" font-weight="400">3,3 В → 5 В · питание 5 В</text>
<polyline points="520,575 340,575" fill="none" stroke="#7c3bb4" stroke-width="3" stroke-linejoin="round" marker-end="url(#purple-arrow)"/>
<polyline points="1100,575 920,575" fill="none" stroke="#7c3bb4" stroke-width="3" stroke-linejoin="round" marker-end="url(#purple-arrow)"/>
<text x="430" y="558" font-size="18" fill="#7c3bb4" text-anchor="middle" font-weight="400">5 В TTL</text>
<text x="1010" y="558" font-size="18" fill="#7c3bb4" text-anchor="middle" font-weight="400">3,3 В</text>
<text x="64" y="671" font-size="21" fill="#364152" text-anchor="start" font-weight="700">2 · GND</text>
<text x="1124" y="671" font-size="21" fill="#364152" text-anchor="start" font-weight="700">GND</text>
<polyline points="340,666 1100,666" fill="none" stroke="#364152" stroke-width="4" stroke-linejoin="round"/>
<text x="720" y="696" font-size="18" fill="#364152" text-anchor="middle" font-weight="400">Общая земля тюнера, ESP32, интерфейса и источника 5 В</text>
<circle cx="340" cy="405" r="5" fill="#fff" stroke="#1763bb" stroke-width="3"/>
<circle cx="1100" cy="405" r="5" fill="#fff" stroke="#1763bb" stroke-width="3"/>
<circle cx="340" cy="575" r="5" fill="#fff" stroke="#7c3bb4" stroke-width="3"/>
<circle cx="1100" cy="575" r="5" fill="#fff" stroke="#7c3bb4" stroke-width="3"/>
<circle cx="340" cy="666" r="5" fill="#fff" stroke="#364152" stroke-width="3"/>
<circle cx="1100" cy="666" r="5" fill="#fff" stroke="#364152" stroke-width="3"/>
<rect x="40" y="728" width="1360" height="70" rx="10" fill="#fff4f3" stroke="#e7a5a4" stroke-width="2"/>
<text x="64" y="758" font-size="22" fill="#b52b32" text-anchor="start" font-weight="700">1 · +12 В на mini-DIN: оставить свободным и изолировать.</text>
<text x="64" y="784" font-size="19" fill="#b52b32" text-anchor="start" font-weight="400">Не соединять с 5V, 3V3 или GPIO. Прямого провода TX тюнера → RX ESP32 нет.</text>
<rect x="40" y="822" width="660" height="228" rx="10" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="64" y="853" font-size="21" fill="#172b42" text-anchor="start" font-weight="700">U1: питание и разрешение выхода</text>
<text x="64" y="885" font-size="19" fill="#167446" text-anchor="start" font-weight="700">3,3 В от ESP32</text>
<polyline points="64,900 590,900" fill="none" stroke="#167446" stroke-width="3" stroke-linejoin="round"/>
<rect x="240" y="920" width="230" height="90" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="355" y="948" font-size="19" fill="#172b42" text-anchor="middle" font-weight="700">U1</text>
<text x="250" y="975" font-size="17" fill="#167446" text-anchor="start" font-weight="400">14 · VCC</text>
<text x="450" y="999" font-size="16" fill="#172b42" text-anchor="end" font-weight="400">1 · /OE + 7 · GND</text>
<polyline points="260,900 260,920" fill="none" stroke="#167446" stroke-width="3" stroke-linejoin="round"/>
<circle cx="260" cy="900" r="5" fill="#167446"/>
