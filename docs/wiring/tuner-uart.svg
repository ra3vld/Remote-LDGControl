<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
<title id="title">Подключение LDG к ESP32 с согласованием UART</title><desc id="desc">Тюнер mini-DIN 4 передаёт через SN74LVC125A на RX ESP32. TX ESP32 через SN74AHCT125 идёт на mini-DIN 3. Контакт 2 — общая земля; контакт 1 +12 В изолировать.</desc>
<defs>
  <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1763bb"/></marker>
  <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3bb4"/></marker>
</defs>
<rect width="1440" height="1100" fill="#fff"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#172b42">
<text x="40" y="48" font-size="30" fill="#172b42" text-anchor="start" font-weight="700">01 / Тюнер ↔ ESP32: три провода и согласование уровней</text>
<text x="40" y="82" font-size="20" fill="#52657b" text-anchor="start" font-weight="400">38400 бод · 8N1 · номера у U1/U2 — выводы микросхем, расположение условное</text>
<rect x="40" y="110" width="1360" height="112" rx="10" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="2"/>
<text x="64" y="148" font-size="22" fill="#172b42" text-anchor="start" font-weight="700">Sunton ESP32-3248S035C</text>
<text x="64" y="184" font-size="21" fill="#1763bb" text-anchor="start" font-weight="400">RX = GPIO35 (P3) · TX = GPIO22 (P3)</text>
<text x="770" y="148" font-size="22" fill="#172b42" text-anchor="start" font-weight="700">NodeMCU: esp32-display / esp32-remote</text>
<text x="770" y="184" font-size="21" fill="#1763bb" text-anchor="start" font-weight="400">RX = GPIO16 · TX = GPIO17</text>
<rect x="40" y="254" width="300" height="442" rx="10" fill="#f5f8fc" stroke="#94a3b8" stroke-width="2"/>
<text x="64" y="292" font-size="23" fill="#172b42" text-anchor="start" font-weight="700">LDG AT-1000ProII</text>
<text x="64" y="323" font-size="19" fill="#52657b" text-anchor="start" font-weight="400">или AT-600ProII · METER</text>
<rect x="1100" y="254" width="300" height="442" rx="10" fill="#f5f8fc" stroke="#94a3b8" stroke-width="2"/>
<text x="1124" y="292" font-size="25" fill="#172b42" text-anchor="start" font-weight="700">ESP32</text>
<text x="1124" y="323" font-size="19" fill="#52657b" text-anchor="start" font-weight="400">GPIO по таблице выше</text>
<text x="64" y="393" font-size="21" fill="#1763bb" text-anchor="start" font-weight="700">4 · TX из тюнера</text>
<text x="1124" y="393" font-size="21" fill="#1763bb" text-anchor="start" font-weight="700">RX · 35 / 16</text>
<rect x="520" y="344" width="400" height="132" rx="10" fill="#eff6ff" stroke="#1763bb" stroke-width="2"/>
<text x="720" y="376" font-size="23" fill="#1763bb" text-anchor="middle" font-weight="700">U1 · SN74LVC125AD</text>
<text x="548" y="413" font-size="20" fill="#1763bb" text-anchor="start" font-weight="400">2 · A</text>
<text x="892" y="413" font-size="20" fill="#1763bb" text-anchor="end" font-weight="400">Y · 3</text>
<text x="720" y="451" font-size="19" fill="#52657b" text-anchor="middle" font-weight="400">5 В → 3,3 В · питание 3,3 В</text>
<polyline points="340,405 520,405" fill="none" stroke="#1763bb" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<polyline points="920,405 1100,405" fill="none" stroke="#1763bb" stroke-width="3" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<text x="430" y="388" font-size="18" fill="#1763bb" text-anchor="middle" font-weight="400">5 В TTL</text>
<text x="1010" y="388" font-size="18" fill="#1763bb" text-anchor="middle" font-weight="400">3,3 В</text>
<text x="64" y="563" font-size="21" fill="#7c3bb4" text-anchor="start" font-weight="700">3 · RX в тюнер</text>
<text x="1124" y="563" font-size="21" fill="#7c3bb4" text-anchor="start" font-weight="700">TX · 22 / 17</text>
<rect x="520" y="514" width="400" height="132" rx="10" fill="#faf5ff" stroke="#7c3bb4" stroke-width="2"/>
