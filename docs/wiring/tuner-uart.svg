<polyline points="505,969.0 535,969.0" fill="none" stroke="#364152" stroke-width="3" stroke-linejoin="round"/>
<polyline points="520,969.0 520,1028" fill="none" stroke="#364152" stroke-width="3" stroke-linejoin="round"/>
<text x="545" y="956.0" font-size="18" fill="#172b42" text-anchor="start" font-weight="700">C1</text>
